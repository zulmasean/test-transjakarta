name: Playwright Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Jalankan test
        run: npm test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          STUDENT_FIRST_NAME: ${{ vars.STUDENT_FIRST_NAME }}
          STUDENT_LAST_NAME: ${{ vars.STUDENT_LAST_NAME }}
          STUDENT_EMAIL: ${{ vars.STUDENT_EMAIL }}
          STUDENT_MOBILE: ${{ vars.STUDENT_MOBILE }}
          STUDENT_ADDRESS: ${{ vars.STUDENT_ADDRESS }}

      - name: Upload laporan HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshot & trace (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
